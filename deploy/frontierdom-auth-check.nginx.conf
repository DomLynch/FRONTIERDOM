# Auth-only same-origin check; game remains unavailable.
server {
    listen 80;
    listen [::]:80;
    server_name frontierdom.com www.frontierdom.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/frontierdom/acme; }
    location / { return 301 https://frontierdom.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.frontierdom.com;
    ssl_certificate /etc/letsencrypt/live/frontierdom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontierdom.com/privkey.pem;
    return 301 https://frontierdom.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name frontierdom.com;
    ssl_certificate /etc/letsencrypt/live/frontierdom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontierdom.com/privkey.pem;
    # Install only after reviewed auth candidate and private env are ready.
    location ^~ /api/v1/auth/ {
        proxy_pass http://127.0.0.1:3097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        # OAuth codes/state appear in query strings; do not record them.
        access_log off;
    }
    # Temporary probe only; no game assets or trade routes are exposed.
    location = /auth-check/ { return 302 /auth-check; }
    location = /auth-check {
        default_type text/html;
        alias /var/www/frontierdom/auth-check/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    }
    location = /auth-check/index.js {
        alias /var/www/frontierdom/auth-check/index.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 503; }
}
