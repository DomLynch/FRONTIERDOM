# Activate only after a frozen candidate passes review and runtime checks.
server {
    listen 80;
    listen [::]:80;
    server_name frontierdom.com www.frontierdom.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/frontierdom/acme; }
    location / { return 301 https://frontierdom.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.frontierdom.com;
    ssl_certificate /etc/letsencrypt/live/frontierdom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontierdom.com/privkey.pem;
    return 301 https://frontierdom.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name frontierdom.com;
    ssl_certificate /etc/letsencrypt/live/frontierdom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontierdom.com/privkey.pem;
    root /var/www/frontierdom/current/client;
    add_header X-Content-Type-Options nosniff always;
    # OAuth query values must never enter access logs.
    location = /api/v1/auth/callback {
        proxy_pass http://127.0.0.1:3097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
        access_log off;
    }
    location ^~ /api/ {
        proxy_cache off;
        proxy_pass http://127.0.0.1:3097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /release.json { add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ =404; }
}
